<!DOCTYPE html>
<html lang="nl-BE">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="css/tailwind.css">

    <title>Contact</title>
</head>

<body>


    <header class="mx-auto px-4 py-3 flex flex-wrap items-center justify-between border-b border-black">

        <p class="text-xl font-bold">Adam Arbi</p>

        <input type="checkbox" id="menu-knop" class="peer sr-only">

        <label for="menu-knop" class="cursor-pointer rounded-lg border border-gray-300 px-3
        py-2 peer-focus-visible:outline-2 md:hidden">Menu</label>

        <nav aria-label="Hoofdmenu" class="hidden w-full peer-checked:block md:block md:mx-auto md:w-auto">
            <ul class="flex flex-col md:flex-row md:gap-2">
                <li><a href="index.html" class="block px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100">Home</a>
                </li>

                <li><a href="portfolio.html"
                        class="block px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100">Portfolio</a></li>

                <li><a href="project.html"
                        class="block px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100">Project</a></li>

                <li><a href="contact.html" aria-current="page"
                        class="block px-3 py-2 rounded-lg bg-blue-100 text-blue-800 font-semibold">Contact</a></li>
            </ul>
        </nav>
    </header>


    <div class="sm:grid grid-cols-4">
        <main class="col-span-3">

            <section class="border-b border-r border-black">

                <h1 class="p-10 font-bold text-2xl">Lorem ipsum dolor sit amet consectetur adipisicing elit. Similique
                    aspernatur voluptatum reiciendis?</h1>

            </section>








            <div class="hidden md:block border-r border-black p-5">

            </div>

            <div class="grid grid-cols-1 md:grid-cols-3">


                <section class="order-1 md:order-2 md:col-span-1 border-b md:border-b-0 border-r border-black">
                    <p class="p-5 pb-10">
                        Lorem ipsum, dolor sit amet consectetur adipisicing elit.
                        Repellat inventore nostrum voluptate esse eum exercitationem.
                    </p>
                </section>

                <section class="order-2 md:order-1 md:col-span-2 p-5 border-r border-black">
                    <form class="space-y-6">
                        <input type="text" name="name" placeholder="Name"
                            class="w-full border-b border-black py-2 outline-none">

                        <input type="email" name="email" placeholder="Email address"
                            class="w-full border-b border-black py-2 outline-none">

                        <textarea name="message" rows="5" placeholder="Your message..."
                            class="w-full border border-black p-3 outline-none"></textarea>

                        <button type="submit"
                            class="px-4 py-2 rounded-md border border-black text-black hover:bg-gray-100">
                            Send message
                        </button>
                    </form>
                </section>

            </div>


        </main>

        <aside class="col-span-1">
            <section class="border-t border-black md:border-0">

                <figure class="m-5">
                    <img src="./images/Media/map.png" alt="Map placeholder"
                        class="w-full h-48 object-cover border border-b-0 border-black">

                    <figcaption class="text-sm border border-black">
                        Lorem ipsum dolor sit amet consectetur adipisicing elit.
                        Repellat inventore nostrum voluptate esse eum exercitationem.
                    </figcaption>

                    <p class="my-5">Lorem ipsum dolor sit amet consectetur adipisicing elit. Earum tempora magnam,
                        quibusdam tenetur soluta nulla.</p>

                </figure>

            </section>
        </aside>
    </div>


    <footer class=" mx-auto px-4 py-5 border-t border-black flex">
        <p class="text-sm text-gray-600">&copy; 2026 Adam Arbi</p>
    </footer>

</body>

</html>
